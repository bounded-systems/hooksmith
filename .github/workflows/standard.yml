name: standard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  standard:
    uses: bounded-systems/.github/.github/workflows/repo-standard.yml@0bb81373f3f585bf8f38ead95a5eed0bfdbdac67
    with:
      security: true
      test: true
      runtime: none
      test-command: "cargo fmt --all --check && cargo check --workspace && cargo test --workspace"
