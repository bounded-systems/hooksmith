# Keep every action pin current — including the shared osv-scan lane's.
#
# DESTINATION: .github/dependabot.yml — NOT .github/workflows/. This is repo
# configuration, not a workflow.
#
# WHY DEPENDABOT AND NOT A BESPOKE RE-PIN BOT (ci-workflows#10)
# -------------------------------------------------------------
# A caller's `uses: ...@<sha>` resolves the reusable workflow AT THAT COMMIT, so
# a stale pin means the repo runs an old scanner with old rules. The 2026-08-03
# census (caller-pins.yml) measured 43 of 58 callers behind the template, and
# nothing makes a stale caller go red on its own.
#
# The fix decomposes the way OpenTofu does: the template is the DESIRED STATE,
# the caller-pins census is the PLAN (an ancestry diff of actual vs desired),
# and something has to be the APPLY. Dependabot's `github-actions` ecosystem is
# that applier, chosen over a broker-credentialed bot because:
#
#   - the engine is GitHub-maintained — nothing bespoke to keep working;
#   - no new credential: a custom actor would need org-wide contents:write PLUS
#     the `workflows` permission (GitHub rejects workflow-file pushes without
#     it), minted from a broker entry that would make ci-workflows' main able to
#     reach every repo's contents — a posture change SHA pins exist to avoid;
#   - it covers consumers the census cannot see: repos that call the lane from
#     inside a combined workflow (infra's _infra-test.yml) rather than a
#     byte-identical deps.yml, and every OTHER action pin (checkout,
#     setup-node, setup-deno) going stale the same way.
#
# Dependabot converges callers onto each referenced repo's LATEST TAG — not its
# default-branch head. An untagged repo is invisible to it: guest-room ran this
# exact ecosystem weekly since June and its group PR bumped checkout/codeql pins
# while leaving the osv-scan pin three template moves behind, because
# ci-workflows had no tags. release-tag.yml now mints one per lane change,
# which is the piece of state that makes this config able to act on the lane
# pin at all. The census stays on as the independent verifier — Dependabot
# proposes, a human merges, the Monday census proves. Once the fleet reads
# current, flip caller-pins' `fail-on-lag` to true: plan must be empty.
#
# ADOPTING THIS FILE
# ------------------
# Repo has no .github/dependabot.yml: copy this file byte-identical.
# Repo already has one (other ecosystems — npm, cargo, pip): APPEND the single
# `github-actions` entry below to its `updates:` list instead. Byte-identity is
# the norm, not a law; a merged config is correct, a clobbered one is not.
#
# The `ci` commit-message prefix is load-bearing: semantic-PR gates in this org
# reject `deps:` (claude-box did, during the rollout), and `ci:` is the accurate
# conventional-commit type for CI configuration.
#
# The single `actions` group collapses each week's bumps into ONE PR per repo —
# 58 repos on a weekly schedule is otherwise a noise machine nobody reads,
# which is the required-baseline.yml failure with extra steps.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # Rust dependencies (Cargo.toml + Cargo.lock).
  #
  # ADDED because this repo took the shared template WHOLESALE instead of
  # appending the github-actions entry to a config carrying its own cargo
  # ecosystem — which is what that template's "ADOPTING THIS FILE" note directs:
  # "Repo already has one (other ecosystems — npm, cargo, pip): APPEND the
  # single github-actions entry below to its updates: list instead."
  # keycard, which has the same shape, merged its config correctly and is the
  # reference for what this should have looked like.
  #
  # The consequence was silent. With no cargo entry there are no Rust version
  # updates, so the RUSTSEC advisories the osv lane reports against Cargo.lock
  # (git2, h2, lru, and others) have never had a PR proposed for them. Several
  # of those advisories have no fixed version published and will still need an
  # osv-scanner.toml acceptance; this entry is what makes the ones that ARE
  # fixable get proposed instead of sitting unnoticed.
  #
  # Weekly, matching the actions entry above, but TWO GROUPS rather than one.
  #
  # WHY NOT A SINGLE `patterns: ["*"]` GROUP (#123)
  # -----------------------------------------------
  # The first PR this ecosystem produced (#123, "bump the cargo group with 37
  # updates") cleared six fixable RUSTSEC advisories and could not be merged,
  # because the same PR also carried three major API breaks. It moved
  # `kube` 0.91 -> 3.1 while leaving `k8s-openapi` pinned at 0.22, and
  # `kube` 3.1 requires `k8s-openapi` 0.27 -- so the lockfile ended up with TWO
  # copies of that crate:
  #
  #   0.22.0  from the direct dependency, with its `v1_28` feature enabled
  #   0.27.1  pulled in by kube 3.1, with NO `v1_*` feature at all
  #
  # `k8s-openapi` requires exactly one `v1_*` feature and panics in its build
  # script without one, so `standard / test` failed on a crate nobody had
  # deliberately touched. Un-breaking it means porting worktree-runner's CRD
  # controller across kube 1.x/2.x/3.x AND the schemars 0.8 -> 1.2 `JsonSchema`
  # rewrite -- a migration, six files deep, that should be reviewed as one.
  # Holding the routine git2/h2/lru security bumps hostage to that review is
  # the failure this split fixes.
  #
  # SPLITTING BY UPDATE-TYPE WOULD NOT HAVE WORKED, and the reason is worth
  # recording: Dependabot classifies by semver field position, so
  # `k8s-openapi` 0.22 -> 0.27 is a MINOR update while `kube` 0.91 -> 3.1 is a
  # MAJOR one. A `update-types: ["minor", "patch"]` group would therefore move
  # k8s-openapi while holding kube back -- reproducing the identical two-copy
  # panic from the opposite direction. These crates are coupled by version, not
  # by update size, so they have to be grouped by NAME.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # The Kubernetes cluster, moved as ONE reviewable migration PR. `kube*`
      # covers kube, kube-derive and kube-runtime, which are released in
      # lockstep; `k8s-openapi` is version-locked to whichever kube is in use;
      # `schemars` supplies the `JsonSchema` derive that kube's CustomResource
      # macro emits, so a kube major generally drags a schemars major with it.
      kube:
        patterns:
          - "kube*"
          - "k8s-openapi"
          - "schemars"
      # Everything else. This is the group that should stay mergeable week to
      # week -- the one that carries the security-relevant bumps (git2, and the
      # parents that move h2 and lru transitively). The exclusions must mirror
      # the kube group above exactly: a name matched by both would land in only
      # one of them, and silently re-couple the two PRs.
      cargo:
        patterns:
          - "*"
        exclude-patterns:
          - "kube*"
          - "k8s-openapi"
          - "schemars"
    # A TEMPORARY HOLD ON THE KUBE CLUSTER, not a permanent mute (#126).
    #
    # The group above puts these five crates in one PR. It does NOT make
    # Dependabot move them to versions COMPATIBLE WITH EACH OTHER, and that
    # distinction is the whole problem: a group controls which PR an update
    # lands in, while Dependabot still resolves every dependency's latest
    # version independently. #125 claimed grouping by name avoided the
    # two-copy k8s-openapi break. It does not, and #126 proved it within
    # minutes of that merge by reproducing the identical panic mirrored:
    #
    #   #123  kube 0.91 -> 3.1, k8s-openapi left at 0.22  ->  0.27.1 has no feature
    #   #126  k8s-openapi 0.22 -> 0.24, kube left at 0.91  ->  0.22.0 has no feature
    #
    # WHY NO CONFIG CAN FIX THIS. k8s-openapi permits exactly ONE version of
    # itself in the graph, and which Kubernetes API it targets is chosen by a
    # mutually-exclusive `v1_*` feature on the DIRECT dependency. `kube` pins a
    # k8s-openapi major (0.91 <-> 0.22, 3.1 <-> 0.27), so the two are a single
    # atomic edit forever. `ignore` is the only lever dependabot.yml has here.
    #
    # THE COST IS NEAR ZERO, which is why this is the right interim trade. Every
    # advisory this repo carries is in git2, h2, lru, backoff, derivative,
    # instant, number_prefix, paste or rustls-pemfile. NONE is kube,
    # k8s-openapi or schemars. Holding these three mutes crates with no
    # findings; the `cargo` group above keeps proposing the ones that have them.
    #
    # LIFTING THIS IS THE DEFINITION OF DONE for the kube migration: bump
    # kube 0.91 -> 3.1, k8s-openapi 0.22 -> 0.27 with a `v1_*` feature that
    # exists in 0.27, and schemars 0.8 -> 1.2 in ONE commit, port
    # worktree-runner's six kube files, then delete this block. The group above
    # is deliberately left in place so it resumes working the moment this goes.
    ignore:
      - dependency-name: "kube*"
      - dependency-name: "k8s-openapi"
      - dependency-name: "schemars"
    commit-message:
      prefix: "chore"
      include: "scope"
